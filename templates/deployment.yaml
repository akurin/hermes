apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the managed config changes, so the new
        # /etc/hermes/config.yaml is picked up on the next start.
        checksum/managed-config: {{ .Values.managedConfig | toYaml | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.dns.nameservers }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: hermes
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - gateway
            - run
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes
            - name: API_SERVER_ENABLED
              value: "false"
            - name: HERMES_DASHBOARD
              value: "0"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed-config
              mountPath: /etc/hermes
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: managed-config
          configMap:
            name: {{ .Release.Name }}-managed
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.sizeLimit | quote }}
