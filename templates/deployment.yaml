apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the managed config changes, so the new
        # /etc/hermes/config.yaml is picked up on the next start.
        checksum/managed-config: {{ .Values.managedConfig | toYaml | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.dns.nameservers }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- if .Values.splitProxy.enabled }}
      initContainers:
        # Native sidecar: starts before the main container, restarts with the
        # pod, and blocks startup until its probe succeeds.
        - name: split-proxy
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          command:
            - python3
            - /etc/split-proxy/proxy.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SPLIT_PROXY_LISTEN
              value: "127.0.0.1:{{ .Values.splitProxy.port }}"
            - name: SPLIT_PROXY_SOCKS
              value: {{ .Values.splitProxy.socksEndpoint | quote }}
            - name: SPLIT_PROXY_DOMAINS
              value: {{ join "," .Values.splitProxy.domains | quote }}
          ports:
            - name: split-proxy
              containerPort: {{ .Values.splitProxy.port }}
          # tcpSocket probes dial the pod IP, which cannot reach a loopback
          # listener; exec runs inside the sidecar.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.splitProxy.port }}), 2).close()"
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.splitProxy.port }}), 2).close()"
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.splitProxy.resources | nindent 12 }}
          volumeMounts:
            - name: split-proxy
              mountPath: /etc/split-proxy
              readOnly: true
      {{- end }}
      containers:
        - name: hermes
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - gateway
            - run
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes
            {{- if .Values.splitProxy.enabled }}
            # Explicit env wins over envFrom, so the sidecar takes over from
            # any proxy values in the hermes-env Secret.
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:{{ .Values.splitProxy.port }}"
            - name: HTTP_PROXY
              value: "http://127.0.0.1:{{ .Values.splitProxy.port }}"
            - name: NO_PROXY
              value: "127.0.0.1,localhost,::1"
            {{- end }}
            - name: API_SERVER_ENABLED
              value: "false"
            - name: HERMES_DASHBOARD
              value: "0"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed-config
              mountPath: /etc/hermes
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: managed-config
          configMap:
            name: {{ .Release.Name }}-managed
        {{- if .Values.splitProxy.enabled }}
        - name: split-proxy
          configMap:
            name: {{ .Release.Name }}-split-proxy
        {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.sizeLimit | quote }}
