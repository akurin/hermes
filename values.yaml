image:
  repository: nousresearch/hermes-agent
  tag: v0.23.0
  pullPolicy: IfNotPresent

# The deployment workflow creates this Secret from GitHub Environment Secrets.
existingSecret: hermes-env

# Split proxy sidecar. The main container gets an HTTP proxy on loopback; only
# the listed domains go through the x13 SOCKS chain, everything else connects
# directly. HTTP is used so requests/httpx clients need no SOCKS dependency.
splitProxy:
  enabled: true
  port: 8118
  socksEndpoint: 192.168.1.100:10808
  domains:
    - openrouter.ai
  # Hosts that bypass the sidecar. The LM Studio box is on the home LAN.
  noProxy:
    - 127.0.0.1
    - localhost
    - "::1"
    - 192.168.1.101
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Rendered to a ConfigMap mounted at /etc/hermes/config.yaml and read through
# Hermes' managed scope. Pinned keys win over /opt/data/config.yaml and the
# environment, and hermes config set refuses to change them. Everything not
# listed here stays editable on the PVC.
managedConfig:
  model:
    provider: openrouter
    # Pin the canonical endpoint so a stale base_url on the PVC cannot leak in.
    base_url: https://openrouter.ai/api/v1
  terminal:
    backend: local
  # Selectable per session with /model custom:lmstudio-lan:<model-id>.
  # LM Studio must be served on the LAN (Developer -> Serve on Network).
  providers:
    lmstudio-lan:
      api: http://192.168.1.101:1234/v1

# Copied to /opt/data/config.yaml only when the volume has no config yet.
# model.default is deliberately not managed, so the CLI can change it later:
#   hermes config set model.default <model-id>
seedConfig:
  model:
    default: nvidia/nemotron-3.5-super-vl:free

persistence:
  size: 5Gi
  storageClassName: local-path

nodeSelector:
  homelab.morjoff.com/workload: home
tolerations:
  - key: dedicated
    operator: Equal
    value: home
    effect: NoSchedule

# x13's host resolver is a systemd-resolved stub; use its LAN resolver in pods.
dns:
  nameservers:
    - 192.168.1.1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

sharedMemory:
  sizeLimit: 512Mi
