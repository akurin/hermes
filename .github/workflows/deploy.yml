name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.1
      - run: helm lint .
      - run: helm template hermes . --namespace hermes > /dev/null

  deploy:
    needs: test
    if: >-
      ${{
        always() && ((github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master') ||
        (github.event_name == 'workflow_dispatch' && needs.test.result == 'success'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.1
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: latest

      # Kubeconfig points at 127.0.0.1:6443. Keep the SSH tunnel and all API
      # commands in the same step so the tunnel stays alive throughout deploy.
      - name: Deploy over SSH tunnel
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          CI_DEPLOY_SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
          K3S_HOST: ${{ secrets.K3S_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_PROXY: ${{ vars.TELEGRAM_PROXY || 'socks5://192.168.1.100:10808' }}
          OPENROUTER_PROXY: ${{ vars.OPENROUTER_PROXY || 'socks5://192.168.1.100:10808' }}
          HERMES_IMAGE_TAG: ${{ vars.HERMES_IMAGE_TAG || 'v0.23.0' }}
        run: |
          set -euo pipefail
          umask 077
          for name in KUBECONFIG_CONTENT CI_DEPLOY_SSH_KEY K3S_HOST \
            TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USERS DEEPSEEK_API_KEY OPENROUTER_API_KEY; do
            if test -z "${!name}"; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$TELEGRAM_ALLOWED_USERS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "TELEGRAM_ALLOWED_USERS must be comma-separated numeric user IDs" >&2
            exit 1
          fi
          export KUBECONFIG="$RUNNER_TEMP/hermes-kubeconfig"
          printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
          # GitHub strips the trailing newline from secret values; ssh-keygen
          # and OpenSSH refuse to load a key without it ("error in libcrypto").
          printf '%s\n' "$CI_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/hermes-ssh-key"
          chmod 600 "$RUNNER_TEMP/hermes-ssh-key"
          ssh -o StrictHostKeyChecking=accept-new \
            -i "$RUNNER_TEMP/hermes-ssh-key" \
            -L 6443:127.0.0.1:6443 -N "ci-deploy@$K3S_HOST" &
          SSH_PID=$!
          trap 'kill $SSH_PID 2>/dev/null || true' EXIT
          sleep 2

          kubectl create namespace hermes --dry-run=client -o yaml | kubectl apply -f -
          secret_args=(
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
            --from-literal=TELEGRAM_ALLOWED_USERS="$TELEGRAM_ALLOWED_USERS"
            --from-literal=DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
            --from-literal=TELEGRAM_PROXY="$TELEGRAM_PROXY"
          )
          # Hermes routes LLM API calls through HTTPS_PROXY/HTTP_PROXY and
          # honours NO_PROXY. OpenRouter is blocked from Russia, so reuse the
          # Xray chain endpoint by default; set OPENROUTER_PROXY=direct to
          # disable. DeepSeek keeps the direct route.
          if [[ "$OPENROUTER_PROXY" != "direct" && "$OPENROUTER_PROXY" != "none" ]]; then
            secret_args+=(
              --from-literal=HTTPS_PROXY="$OPENROUTER_PROXY"
              --from-literal=HTTP_PROXY="$OPENROUTER_PROXY"
              --from-literal=NO_PROXY="127.0.0.1,localhost,::1,api.deepseek.com"
            )
          fi
          # Recreate rather than apply: apply merges against the last-applied
          # config, so keys removed from GitHub (for example a retired
          # provider key) can linger. Delete + create makes the Secret match
          # the workflow inputs exactly.
          kubectl -n hermes delete secret hermes-env --ignore-not-found
          kubectl -n hermes create secret generic hermes-env "${secret_args[@]}"

          helm upgrade --install hermes . --namespace hermes \
            --set-string image.tag="$HERMES_IMAGE_TAG" \
            --atomic --wait --timeout 15m
          kubectl -n hermes rollout restart deployment/hermes
          kubectl -n hermes rollout status deployment/hermes --timeout=300s
